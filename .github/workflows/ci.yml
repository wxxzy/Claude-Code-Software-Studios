# USDS Framework CI — see docs/arch/ADR-001-framework-self-hardening.md (D3)
# Gates: bats regression suite on ubuntu (blocking).
# Reports: shellcheck (non-blocking first iteration), installer dry-runs, windows git-bash smoke.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  bats:
    name: Bats regression suite (ubuntu, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bats
        run: npm install -g bats

      - name: Run hook regression tests
        run: bats tests/hooks/*.bats

  shellcheck:
    name: Shellcheck (report only)
    runs-on: ubuntu-latest
    continue-on-error: true # first iteration: observe before promoting to a gate
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (static binary — apt on hosted runners has hung before)
        run: |
          SC_VER="v0.9.0"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" -o /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo mv "/tmp/shellcheck-${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck (non-blocking)
        run: |
          set +e  # collect findings, never fail the job
          FAIL=0
          for f in .claude/hooks/*.sh .claude/hooks/lib/*.sh .claude/statusline.sh scripts/install-usds.sh; do
            echo "--- $f ---"
            shellcheck "$f" || FAIL=1
          done
          [ "$FAIL" -eq 0 ] && echo "shellcheck: clean" || echo "shellcheck: findings present (non-blocking)"
          exit 0

  installer-dryrun:
    name: Installer dry-run (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: studio profile
        run: bash scripts/install-usds.sh --profile studio --dry-run
      - name: full profile
        run: bash scripts/install-usds.sh --profile full --dry-run
      - name: vibe profile
        run: bash scripts/install-usds.sh --profile vibe --dry-run
      - name: minimal profile
        run: bash scripts/install-usds.sh --profile minimal --dry-run

  windows-smoke:
    name: Windows smoke (installer + git-bash hooks)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer dry-run
        shell: pwsh
        run: .\scripts\install-usds.ps1 -Profile studio -DryRun

      - name: Installer scriptblock e2e (irm | iex semantics)
        # Locks three remote-form bugs: (1) "exit" in a dynamic scriptblock
        # kills the user's whole PowerShell session, (2) $script:-scoped
        # accumulation left the manifest nearly empty, (3) piped uninstall
        # demanded -Profile / could never confirm. If this step survives to
        # the end, all three stay fixed.
        shell: pwsh
        run: |
          $T = Join-Path $env:TEMP "usds-e2e-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $T | Out-Null
          # Read the installer BEFORE Push-Location: relative paths resolve
          # against the (empty) temp dir afterwards
          $s = Get-Content .\scripts\install-usds.ps1 -Raw
          if (-not $s) { throw "installer source not read" }
          Push-Location $T
          try {
            & ([scriptblock]::Create($s)) -Profile studio -Force *> $null
            if ($LASTEXITCODE -ne 0) { throw "scriptblock install rc=$LASTEXITCODE (session survived?)" }
            $manifest = Join-Path $T '.usds-manifest'
            $entries = (Get-Content $manifest | Where-Object { $_ -notmatch '^#' }).Count
            if ($entries -lt 40) { throw "manifest too small: $entries entries (scope accumulation regression)" }
            & ([scriptblock]::Create($s)) -Uninstall *> $null
            if ($LASTEXITCODE -ne 1) { throw "uninstall without -Force must fail rc=1, got $LASTEXITCODE" }
            & ([scriptblock]::Create($s)) -Uninstall -Force *> $null
            if ($LASTEXITCODE -ne 0) { throw "uninstall -Force rc=$LASTEXITCODE" }
            if (Test-Path $manifest) { throw "manifest not removed" }
            Write-Host "scriptblock e2e OK: $entries manifest entries, session survived all runs"
          } finally {
            Pop-Location
            Remove-Item $T -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Hook smoke via git-bash (validate-push)
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          $env:PATH = "C:\Program Files\Git\bin;$env:PATH"
          $json = '{"tool_input":{"command":"git push origin master"}}'
          $json | & $bash .claude/hooks/validate-push.sh 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "validate-push smoke failed: $LASTEXITCODE" }

      - name: Hook smoke via git-bash (validate-assets)
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          $env:PATH = "C:\Program Files\Git\bin;$env:PATH"
          $tmp = Join-Path $env:TEMP "usds-smoke-$([guid]::NewGuid().ToString('N')).txt"
          Set-Content -Path $tmp -Value 'x = 1'
          $json = '{"tool_name":"Write","tool_input":{"file_path":"' + ($tmp -replace '\\','/') + '","content":"x"}}'
          $json | & $bash .claude/hooks/validate-assets.sh 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "validate-assets smoke failed: $LASTEXITCODE" }
          Remove-Item $tmp -Force
